[project]
name = "finclaude"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "markdown>=3.11",
    "moomoo-api>=10.11.7108",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "plotly>=7.1.0",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "scipy>=1.18.1",
    "yfinance>=1.7.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["network: needs internet access (live market data)"]
