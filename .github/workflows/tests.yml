name: tests

on:
  push:
  pull_request:

jobs:
  offline:
    name: offline tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      UV_PYTHON: "3.12"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2  # setup-uv has no moving major tags after v7
      - run: uv sync --frozen
      - run: uv run pytest -q -m "not network"
